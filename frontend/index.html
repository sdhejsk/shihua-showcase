<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>石化地学数据展示平台</title>
    <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css?v=20260912-legacy" />
  </head>
  <body>
    <div class="app-shell" data-spa-shell>
      <header class="app-header">
        <div class="app-header__brand">
          <img class="platform-logo" src="./assets/sinopec-logo.svg" alt="中国石化" />
          <div>
            <h1>石化海外油气数据评价协同平台</h1>
            <p class="app-header__desc">Overseas Oil &amp; Gas Data Evaluation Collaboration Platform</p>
          </div>
        </div>
        <div class="app-header__side">
          <div class="header-utilities">
            <span>个人信息</span><i></i><span>问题反馈</span><i></i><span>在线帮助</span>
          </div>
          <div class="mode-card">
            <span>当前模块：</span>
            <strong>数据概览</strong>
            <small>总览</small>
          </div>
          <div class="hero-tags"></div>
        </div>
      </header>
      <div class="app-workspace">
        <aside class="main-nav" aria-label="平台模块">
          <div class="main-nav__label">平台工作区</div>
          <a class="main-nav__item" data-module-nav="overview" href="#overview"><i aria-hidden="true"></i><span>数据概览</span></a>
          <a class="main-nav__item" data-module-nav="data" href="#data"><i aria-hidden="true"></i><span>数据信息模块</span></a>
          <a class="main-nav__item" data-module-nav="evaluation" href="#evaluation"><i aria-hidden="true"></i><span>评价算法模块</span></a>
          <a class="main-nav__item" data-module-nav="services" href="#services"><i aria-hidden="true"></i><span>服务状态</span></a>
          <div class="main-nav__context" data-shell-context></div>
        </aside>
        <main class="page-main">
          <div class="workspace-crumb"><span>首页</span><i>/</i><strong data-workspace-current>数据概览</strong></div>
          <div class="page-content">
            <section class="module-view" data-module-container="overview"></section>
            <section class="module-view" data-module-container="data" style="display:none"></section>
            <section class="module-view" data-module-container="evaluation" style="display:none"></section>
            <section class="module-view" data-module-container="services" style="display:none"></section>
          </div>
        </main>
      </div>
    </div>
    <script src="../node_modules/leaflet/dist/leaflet.js"></script>
    <script type="module" src="./js/spa-shell.js?v=20260804-spa"></script>
  </body>
</html>
